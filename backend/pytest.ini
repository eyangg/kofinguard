[pytest]
testpaths = tests
pythonpath = .
# 기본 pytest는 인터넷·OpenAI·모델·Supabase 없이 돈다. 실제 호출은 -m llm / -m models / -m postgres
addopts = -m "not llm and not models and not postgres"
markers =
    llm: 실제 OpenAI API 호출 (비용 발생)
    models: 실제 Qwen GGUF·Llama Guard(Ollama) 사용
    postgres: Supabase 테스트 DB 사용
